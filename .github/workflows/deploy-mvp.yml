name: Build And Deploy WarmHouse MVP Site

on:
  workflow_dispatch:
  push:
    branches:
      - warmhouse
    paths:
      - 'apps/mvp_site/**'
      - 'deploy/compose/docker-compose.mvp.yml'
      - 'deploy/nginx/mvp.yerlan-amantaiuly.kz.conf'
      - 'deploy/scripts/mvp-smoke-check.sh'
      - '.github/workflows/deploy-mvp.yml'

env:
  REGISTRY: ghcr.io
  MVP_SITE_IMAGE: ghcr.io/${{ github.repository_owner }}/warmhouse-mvp-site

jobs:
  build-mvp-image:
    name: Build And Push MVP Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push MVP site image
        uses: docker/build-push-action@v6
        with:
          context: ./apps/mvp_site
          file: ./apps/mvp_site/Dockerfile
          push: true
          tags: |
            ${{ env.MVP_SITE_IMAGE }}:${{ github.sha }}
            ${{ env.MVP_SITE_IMAGE }}:${{ github.ref_name }}

  deploy-mvp-to-vps:
    name: Deploy MVP To VPS
    needs: build-mvp-image
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare MVP directories on VPS
        uses: appleboy/ssh-action@v1.0.3
        env:
          MVP_VPS_APP_DIR: ${{ secrets.MVP_VPS_APP_DIR }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          envs: MVP_VPS_APP_DIR
          script: |
            set -e
            mkdir -p "$MVP_VPS_APP_DIR/compose"

      - name: Copy MVP deployment files to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          source: "deploy/compose/docker-compose.mvp.yml"
          target: ${{ secrets.MVP_VPS_APP_DIR }}/compose
          strip_components: 2

      - name: Deploy MVP stack on VPS
        uses: appleboy/ssh-action@v1.0.3
        env:
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
          GHCR_OWNER: ${{ github.repository_owner }}
          IMAGE_TAG: ${{ github.sha }}
          MVP_VPS_APP_DIR: ${{ secrets.MVP_VPS_APP_DIR }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          envs: GHCR_USERNAME,GHCR_PULL_TOKEN,GHCR_OWNER,IMAGE_TAG,MVP_VPS_APP_DIR
          script: |
            set -e
            echo "$GHCR_PULL_TOKEN" | docker login ghcr.io -u "$GHCR_USERNAME" --password-stdin
            cd "$MVP_VPS_APP_DIR/compose"
            GHCR_OWNER="$GHCR_OWNER" IMAGE_TAG="$IMAGE_TAG" docker compose -f docker-compose.mvp.yml pull
            GHCR_OWNER="$GHCR_OWNER" IMAGE_TAG="$IMAGE_TAG" docker compose -f docker-compose.mvp.yml up -d --remove-orphans

      - name: Run MVP smoke checks
        env:
          MVP_APP_DOMAIN: ${{ secrets.MVP_APP_DOMAIN }}
        run: bash ./deploy/scripts/mvp-smoke-check.sh

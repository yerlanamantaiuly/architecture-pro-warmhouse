server {
    listen 80;
    server_name mvp.yerlan-amantaiuly.kz;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name mvp.yerlan-amantaiuly.kz;

    ssl_certificate /etc/letsencrypt/live/mvp.yerlan-amantaiuly.kz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mvp.yerlan-amantaiuly.kz/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location = / {
        add_header Content-Type text/plain;
        return 200 'WarmHouse MVP API';
    }

    location = /health {
        proxy_pass http://127.0.0.1:8092/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /devices {
        proxy_pass http://127.0.0.1:8091;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /telemetry {
        proxy_pass http://127.0.0.1:8092;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

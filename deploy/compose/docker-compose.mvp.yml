services:
  postgres-mvp:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: warmhouse_mvp
    volumes:
      - postgres_mvp_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d warmhouse_mvp"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
    restart: unless-stopped

  temperature-api-mvp:
    image: ghcr.io/${GHCR_OWNER}/warmhouse-temperature-api:warmhouse
    environment:
      PORT: 8081
      TEMPERATURE_DELAY_MS: 0
      TEMPERATURE_FAILURE_RATE: 0
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8081/health >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 5s
    restart: unless-stopped

  device-registry:
    image: ghcr.io/${GHCR_OWNER}/warmhouse-mvp-device-registry:${IMAGE_TAG}
    depends_on:
      postgres-mvp:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@postgres-mvp:5432/warmhouse_mvp
    ports:
      - "127.0.0.1:8091:8000"
    restart: unless-stopped

  telemetry-service:
    image: ghcr.io/${GHCR_OWNER}/warmhouse-mvp-telemetry:${IMAGE_TAG}
    depends_on:
      postgres-mvp:
        condition: service_healthy
      temperature-api-mvp:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@postgres-mvp:5432/warmhouse_mvp
      TEMPERATURE_API_URL: http://temperature-api-mvp:8081
    ports:
      - "127.0.0.1:8092:8000"
    restart: unless-stopped

volumes:
  postgres_mvp_data:
